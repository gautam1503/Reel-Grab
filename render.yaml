# One-click deploy: Render dashboard → New → Blueprint → pick this repo
services:
  - type: web
    name: reelgrab
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # YouTube blocks cloud servers without a signed-in session. Upload a Netscape-format
      # cookies.txt as a Render "Secret File" named cookies.txt; it is mounted at this path.
      - key: YTDLP_COOKIES_FILE
        value: /etc/secrets/cookies.txt
